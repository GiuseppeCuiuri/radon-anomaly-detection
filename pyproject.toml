[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radon-ad"
version = "0.1.0"
description = "RADON: Robust Autoencoder for Unsupervised Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anomaly-detection", "autoencoder", "unsupervised-learning", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Type stubs, so `mypy` runs clean without a separate --install-types step.
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
notebook = ["ipykernel>=6.29", "jupyterlab>=4.0"]

[project.scripts]
radon-train = "radon.cli.train:main"
radon-explain = "radon.cli.explain:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that download data or train a model",
]
filterwarnings = ["error::DeprecationWarning:radon.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
# N803/N806: allow X / N_MIN style names from the ML literature.
# N812: `import torch.nn.functional as F` is the universal PyTorch convention.
ignore = ["N803", "N806", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.10"
packages = ["radon"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["torchvision.*", "sklearn.*", "scipy.*", "matplotlib.*", "pandas.*"]
ignore_missing_imports = true
