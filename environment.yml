# Conda environment for RADON.
#
#   conda env create -f environment.yml
#   conda activate radon
#   pip install -e ".[dev]"
#
# For a CPU-only setup, drop the `pytorch-cuda` line and the `nvidia` channel;
# the CPU build is adequate for the dataset sizes used here.

name: radon

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12

  # Core
  - pytorch>=2.0
  - torchvision>=0.15
  - pytorch-cuda=12.1
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0

  # Notebook
  - ipykernel
  - jupyterlab

  # Development
  - pytest>=8.0
  - pytest-cov>=5.0
  - ruff>=0.6
  - mypy>=1.11

  - pip
